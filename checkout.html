<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — INA Agro Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .checkout-wrap { max-width: 900px; margin: 40px auto 80px; padding: 0 24px; display: grid; grid-template-columns: 1fr 340px; gap: 32px; }
    .checkout-card { background: white; border: 1px solid #e2e8e4; border-radius: 16px; padding: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8e4; border-radius: 8px; font-size: 0.95rem; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #1a7a4c; }
    .payment-methods { display: grid; gap: 10px; margin: 16px 0; }
    .pay-option { border: 1.5px solid #e2e8e4; border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.15s; }
    .pay-option:hover, .pay-option.selected { border-color: #1a7a4c; background: #e8f5ee; }
    .pay-option input { width: auto; }
    .summary-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 0.95rem; }
    .summary-total { border-top: 2px solid #e2e8e4; margin-top: 12px; padding-top: 14px; font-size: 1.15rem; font-weight: 700; }
    .steps { display: flex; gap: 8px; margin-bottom: 28px; }
    .step { flex: 1; text-align: center; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; background: #f0f0f0; color: #888; }
    .step.active { background: #1a7a4c; color: white; }
    .step.done { background: #e8f5ee; color: #1a7a4c; }
    @media(max-width:768px){ .checkout-wrap{ grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🌱</div>
        <div>INA Agro Connect<span>Checkout</span></div>
      </a>
      <div class="nav-actions">
        <a href="pricing.html" class="btn btn-outline btn-sm">← Back to Pricing</a>
      </div>
    </div>
  </nav>

  <div style="max-width:900px;margin:24px auto 0;padding:0 24px;">
    <div class="steps">
      <div class="step done">1. Plan</div>
      <div class="step active">2. Details</div>
      <div class="step">3. Payment</div>
      <div class="step">4. Confirm</div>
    </div>
  </div>

  <div class="checkout-wrap">
    <!-- Form -->
    <div class="checkout-card">
      <h2 style="font-size:1.4rem;margin-bottom:20px;">Billing Details</h2>
      <form id="checkoutForm">
        <div class="form-group">
          <label>Company / Full Name *</label>
          <input type="text" placeholder="INA Natural Products PLC" required />
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" placeholder="you@company.com" required />
        </div>
        <div class="form-group">
          <label>Phone *</label>
          <input type="tel" placeholder="+251 9..." required />
        </div>
        <div class="form-group">
          <label>TIN / Business Registration (optional)</label>
          <input type="text" placeholder="Tax Identification Number" />
        </div>
        <div class="form-group">
          <label>City / Region</label>
          <select>
            <option>Addis Ababa</option>
            <option>Oromia</option>
            <option>Amhara</option>
            <option>Sidama</option>
            <option>SNNPR</option>
            <option>Other</option>
          </select>
        </div>

        <h3 style="margin:28px 0 14px;font-size:1.1rem;">Payment Method</h3>
        <div class="payment-methods">
          <label class="pay-option selected">
            <input type="radio" name="payment" value="telebirr" checked />
            <div>
              <strong>Telebirr</strong>
              <div style="font-size:0.85rem;color:#5a6a5e;">Ethio Telecom mobile money</div>
            </div>
          </label>
          <label class="pay-option">
            <input type="radio" name="payment" value="cbe" />
            <div>
              <strong>CBE Birr / CBE Mobile</strong>
              <div style="font-size:0.85rem;color:#5a6a5e;">Commercial Bank of Ethiopia</div>
            </div>
          </label>
          <label class="pay-option">
            <input type="radio" name="payment" value="bank" />
            <div>
              <strong>Bank Transfer</strong>
              <div style="font-size:0.85rem;color:#5a6a5e;">Direct deposit to INA Agro account</div>
            </div>
          </label>
          <label class="pay-option">
            <input type="radio" name="payment" value="card" />
            <div>
              <strong>Card (Visa / Mastercard)</strong>
              <div style="font-size:0.85rem;color:#5a6a5e;">International cards via payment gateway</div>
            </div>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem;margin-top:20px;">
          Pay Now →
        </button>
      </form>
    </div>

    <!-- Order Summary -->
    <div>
      <div class="checkout-card" style="position:sticky;top:90px;">
        <h3 style="font-size:1.1rem;margin-bottom:16px;">Order Summary</h3>
        <div id="planName" style="font-weight:600;margin-bottom:4px;">Pro Supplier</div>
        <div style="font-size:0.9rem;color:#5a6a5e;margin-bottom:16px;">Monthly subscription</div>
        
        <div class="summary-row">
          <span>Plan</span>
          <span id="planPrice">1,999 ETB</span>
        </div>
        <div class="summary-row">
          <span>VAT (15%)</span>
          <span id="vatAmount">300 ETB</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total</span>
          <span id="totalAmount">2,299 ETB</span>
        </div>

        <div style="margin-top:20px;padding:14px;background:#e8f5ee;border-radius:10px;font-size:0.85rem;color:#0f5c38;">
          ✓ Instant access after payment<br>
          ✓ Cancel anytime<br>
          ✓ Invoice sent by email
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simple plan detection from URL
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || 'pro';
    const plans = {
      pro: { name: 'Pro Supplier', price: 1999, period: 'Monthly subscription' },
      premium: { name: 'Premium Supplier', price: 4999, period: 'Monthly subscription' },
      pro_year: { name: 'Pro Supplier (Yearly)', price: 19999, period: 'Yearly subscription' },
      premium_year: { name: 'Premium Supplier (Yearly)', price: 49999, period: 'Yearly subscription' }
    };
    const selected = plans[plan] || plans.pro;
    const vat = Math.round(selected.price * 0.15);
    const total = selected.price + vat;

    document.getElementById('planName').textContent = selected.name;
    document.getElementById('planPrice').textContent = selected.price.toLocaleString() + ' ETB';
    document.getElementById('vatAmount').textContent = vat.toLocaleString() + ' ETB';
    document.getElementById('totalAmount').textContent = total.toLocaleString() + ' ETB';

    // Payment option selection UI
    document.querySelectorAll('.pay-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.pay-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        opt.querySelector('input').checked = true;
      });
    });

    document.getElementById('checkoutForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Payment flow demo: In production this would redirect to Telebirr / CBE / card gateway.\n\nPlan: ' + selected.name + '\nTotal: ' + total.toLocaleString() + ' ETB');
    });
  </script>
</body>
</html>
